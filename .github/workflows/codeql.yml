name: CodeQL

on:
  push:
    branches:
      - release/2.x
  pull_request:
    branches:
      - release/2.x
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build root library package
        run: |
          # Force traced compilation of CocoaMQTT and CocoaMQTTWebSocket.
          swift package clean
          swift build

      - name: Analyze and upload
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
